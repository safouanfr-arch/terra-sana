spring.datasource.url=${TERRA_SANA_DB_URL}
spring.datasource.username=${TERRA_SANA_DB_USERNAME}
spring.datasource.password=${TERRA_SANA_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never

server.servlet.session.cookie.secure=true
app.frontend-base-url=${TERRA_SANA_FRONTEND_URL}
app.cors.allowed-origins=${TERRA_SANA_CORS_ORIGINS:}
