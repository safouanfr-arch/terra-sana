spring.application.name=siteECommerce
spring.config.import=optional:file:./config/application-secrets.properties
spring.datasource.url=jdbc:h2:file:./data/terra-sana;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.h2.console.enabled=true

server.port=8081
app.frontend-base-url=http://localhost:5173

# Email SMTP reel.
# La configuration Gmail locale est chargee depuis config/application-secrets.properties.
# Ce fichier reste local au PC et ne doit pas etre versionne.
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=
spring.mail.password=
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=no-reply@terrasana.local
app.mail.enabled=false

# Rappel automatique des commandes dont le retrait est prevu le lendemain.
app.order-reminder.enabled=true
app.order-reminder.cron=0 */15 * * * *
