spring.application.name=siteECommerce
spring.profiles.default=dev
spring.jpa.show-sql=false
spring.h2.console.enabled=false

server.port=8081
server.servlet.session.timeout=30m
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
app.frontend-base-url=http://localhost:5173
app.membership.conditions-version=v1.0
app.membership.rate-limit.window-minutes=10
app.membership.rate-limit.max-per-ip=10
app.membership.rate-limit.max-per-email=3

# Email SMTP reel.
# La configuration Gmail locale est chargee depuis config/application-secrets.properties.
# Ce fichier reste local au PC et ne doit pas etre versionne.
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=
spring.mail.password=
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=no-reply@terrasana.local
app.mail.enabled=false

# Rappel automatique des commandes dont le retrait est prevu le lendemain.
app.order-reminder.enabled=true
app.order-reminder.cron=0 */15 * * * *

# Passage automatique des commandes confirmees en preparation dans les 24 heures avant retrait.
app.order-preparation.enabled=true
app.order-preparation.cron=0 */5 * * * *
app.order-preparation.email.enabled=true
app.order-preparation.email.recipient=${TERRA_SANA_PREPARATION_EMAIL:}
